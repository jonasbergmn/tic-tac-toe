<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6750a4">
    <title>Four-in-a-Row</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="app-shell">
        <section id="lobby-container" class="surface-card">
            <div class="page-header">
                <p class="eyebrow">Multiplayer lobby</p>
                <h1>Four-in-a-Row</h1>
                <p class="subtitle">Pick a room and start a polished real-time match with chat.</p>
                <a href="https://github.com/jonasbergmn/tic-tac-toe" target="_blank" rel="noreferrer" class="github-link">
                    <span class="material-symbols-outlined" aria-hidden="true">code</span>
                    View repository
                </a>
            </div>
            <div id="room-list" class="room-list">
                <!-- Room list will be generated by JavaScript -->
            </div>
        </section>

        <section class="game-container surface-card" style="display: none;">
            <div class="page-header page-header--compact">
                <p class="eyebrow">Live match</p>
                <h1>Four-in-a-Row</h1>
            </div>

            <div class="status-panel">
                <div id="player-info" class="status-chip"></div>
                <div id="game-status" class="status-banner">Connecting to server...</div>
            </div>

            <div class="board-panel">
                <div id="game-board" aria-label="Game board">
                    <!-- Board will be generated by JavaScript -->
                </div>
            </div>

            <div class="actions-row">
                <button id="reset-button" type="button">Reset game</button>
            </div>

            <section id="chat" class="chat-panel">
                <div class="chat-header">
                    <span class="material-symbols-outlined" aria-hidden="true">chat</span>
                    <h2>Match chat</h2>
                </div>
                <div id="chat-messages" class="chat-messages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="Type a message..." aria-label="Chat message">
                    <button id="send-chat-button" type="button">Send</button>
                </div>
            </section>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
